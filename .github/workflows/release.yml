name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            apple_signing_identity: '-'
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            apple_signing_identity: '-'
          - platform: ubuntu-22.04
            args: ''
            apple_signing_identity: ''
          - platform: windows-latest
            args: ''
            apple_signing_identity: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          jq --arg version "$VERSION" '.version = $version' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

      # `releaseBody` is what tauri-action writes into latest.json's `notes`,
      # which is the text the in-app update panel shows. Editing the GitHub
      # release body afterwards does NOT change it, so it has to be right here.
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          # The intro paragraph of this version's section: skip the heading and
          # any blank lines, then take lines up to the next blank line.
          BODY=$(awk -v tag="## [$VERSION]" '
            index($0, tag) == 1 { found = 1; next }
            found && !started && NF == 0 { next }
            found && NF > 0 { started = 1; print; next }
            found && started && NF == 0 { exit }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            echo "::warning::No CHANGELOG section found for $VERSION; falling back to placeholder text."
            BODY="See the release notes for this version."
          fi

          {
            echo "body<<SUBTRKR_NOTES_EOF"
            printf '%s\n' "$BODY"
            echo "SUBTRKR_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Release notes resolved to:"
          printf '%s\n' "$BODY"

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SubTrkr ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          generateReleaseNotes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          tauriScript: bun tauri
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          # Keep public download URLs stable across releases.
          assetNamePattern: '[name]-[platform]-[arch][_setup][ext]'
